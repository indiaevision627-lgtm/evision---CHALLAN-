      desc: "",
      qty: 1,
      unit: "Nos.",

    }],
    tax: "-",

  };

/* ================= APP ================= */
function App() {
  const [loaded, setLoaded] = useState(false);
  const [clients, setClients] = useState([]);
  const [orders, setOrders] = useState([]);
  const [challans, setChallans] = useState([]);
  const [profile, setProfile] = useState(DEFAULT_PROFILE);
  const [tab, setTab] = useState("orders");
  const [search, setSearch] = useState("");
  const [error, setError] = useState("");
  const [showAddClient, setShowAddClient] = useState(false);
  const [showAddOrder, setShowAddOrder] = useState(false);
  const [clientForm, setClientForm] = useState({
    name: "",
    phone: "",
    address: ""
  });
  const [orderForm, setOrderForm] = useState({
    client_id: "",
    camera_type: "Dome",
    qty: 4,
    install_date: "",
    total_amount: "",
    advance: "",
    notes: ""
  });
  const [draft, setDraft] = useState(newChallanDraft("EV/102"));
  const [seq, setSeq] = useState(2);
  useEffect(() => {
    loadAll();
  }, []);
  async function loadAll() {
    try {
      const [c, o, ch, p] = await Promise.all([sb.from("clients").select("*").order("created_at", {
        ascending: false
      }), sb.from("orders").select("*").order("created_at", {
        ascending: false
      }), sb.from("challans").select("*").order("created_at", {
        ascending: false
      }), sb.from("company_profile").select("*").eq("id", 1)]);
      if (c.error || o.error || ch.error || p.error) throw c.error || o.error || ch.error || p.error;
      setClients(c.data || []);
      setOrders(o.data || []);
      setChallans(ch.data || []);
      const loadedProfile = p.data && p.data[0] || {};
      const mergedProfile = {
        ...DEFAULT_PROFILE,
        ...loadedProfile
      };
      Object.keys(DEFAULT_PROFILE).forEach(k => {
        if (!mergedProfile[k]) mergedProfile[k] = DEFAULT_PROFILE[k];
      });
      setProfile(mergedProfile);
      setDraft(newChallanDraft(`EV/${102 + (ch.data || []).length}`));
    } catch (e) {
      setError("Data load nahi ho paya: " + (e.message || e));
    } finally {
      setLoaded(true);
    }
  }
  const clientsById = useMemo(() => {
    const m = {};
    clients.forEach(c => m[c.id] = c);
    return m;
  }, [clients]);
  const stats = useMemo(() => {
    const totalClients = clients.length;
    const activeJobs = orders.filter(o => o.status !== "Completed").length;
    const pendingPayment = orders.reduce((sum, o) => {
      const bal = Number(o.total_amount || 0) - Number(o.advance || 0);
      return o.status !== "Completed" && bal > 0 ? sum + bal : sum;
    }, 0);
    const collected = orders.reduce((sum, o) => sum + Number(o.advance || 0) + (o.status === "Completed" ? Number(o.total_amount || 0) - Number(o.advance || 0) : 0), 0);
    return {
      totalClients,
      activeJobs,
      pendingPayment,
      collected
    };
  }, [clients, orders]);
  const filteredOrders = useMemo(() => {
    const q = search.trim().toLowerCase();
    return orders.filter(o => {
      if (!q) return true;
      const c = clientsById[o.client_id];
      return (c?.name || "").toLowerCase().includes(q) || (o.camera_type || "").toLowerCase().includes(q);
    });
  }, [orders, search, clientsById]);
  const filteredClients = useMemo(() => {
    const q = search.trim().toLowerCase();
    return clients.filter(c => !q || c.name.toLowerCase().includes(q) || (c.phone || "").includes(q));
  }, [clients, search]);
  async function addClient(e) {
    e.preventDefault();
    if (!clientForm.name.trim() || !clientForm.phone.trim()) return;
    const {
      data,
      error
    } = await sb.from("clients").insert(clientForm).select();
    if (error) return setError(error.message);
    setClients([data[0], ...clients]);
    setClientForm({
      name: "",
      phone: "",
      address: ""
    });
    setShowAddClient(false);
  }
  async function addOrder(e) {
    e.preventDefault();
    if (!orderForm.client_id || !orderForm.total_amount) return;
    const payload = {
      client_id: orderForm.client_id,
      camera_type: orderForm.camera_type,
      qty: Number(orderForm.qty || 1),
      install_date: orderForm.install_date || null,
      status: "Enquiry",
      total_amount: Number(orderForm.total_amount),
      advance: Number(orderForm.advance || 0),
      notes: orderForm.notes
    };
    const {
      data,
      error
    } = await sb.from("orders").insert(payload).select();
    if (error) return setError(error.message);
    setOrders([data[0], ...orders]);
    setOrderForm({
      client_id: "",
      camera_type: "Dome",
      qty: 4,
      install_date: "",
      total_amount: "",
      advance: "",
      notes: ""
    });
    setShowAddOrder(false);
  }
  async function updateStatus(orderId, status) {
    const {
      error
    } = await sb.from("orders").update({
      status
    }).eq("id", orderId);
    if (error) return setError(error.message);
    setOrders(orders.map(o => o.id === orderId ? {
      ...o,
      status
    } : o));
  }
  async function deleteOrder(id) {
    const {
      error
    } = await sb.from("orders").delete().eq("id", id);
    if (error) return setError(error.message);
    setOrders(orders.filter(o => o.id !== id));
  }
  async function deleteClient(id) {
    const {
      error
    } = await sb.from("clients").delete().eq("id", id);
    if (error) return setError(error.message);
    setClients(clients.filter(c => c.id !== id));
    setOrders(orders.filter(o => o.client_id !== id));
  }
  async function updateProfileField(field, value) {
    const next = {
      ...profile,
      [field]: value
    };
    setProfile(next);
    await sb.from("company_profile").update({
      [field]: value,
      updated_at: new Date().toISOString()
    }).eq("id", 1);
  }
  function addChallanItem() {
    const nextSeq = seq + 1;
    setSeq(nextSeq);
    setDraft({
      ...draft,
      items: [...draft.items, {
        localId: nextSeq,
        desc: "",
        qty: 1,
        unit: "Nos.",
        total: ""
      }]
    });
  }
  function updateChallanItem(localId, field, value) {
    setDraft({
      ...draft,
      items: draft.items.map(it => it.localId === localId ? {
        ...it,
        [field]: value
      } : it)
    });
  }
  function removeChallanItem(localId) {
    setDraft({
      ...draft,
      items: draft.items.filter(it => it.localId !== localId)
    });
  }
  const challanTotals = useMemo(() => {
    const subtotal = draft.items.reduce((s, it) => s + (Number(it.total) || 0), 0);
    const taxNum = draft.tax === "-" || draft.tax === "" ? 0 : Number(draft.tax) || 0;
    const shipping = Number(draft.shipping) || 0;
    const other = Number(draft.other) || 0;
    return {
      subtotal,
      total: subtotal + taxNum + shipping + other
    };
  }, [draft]);
  async function saveChallan() {
    const payload = {
      challan_no: draft.challanNo,
      date: draft.date,
      delivery_address: draft.deliveryAddress,
      items: draft.items.map(({
        desc,
        qty,
        unit,
        total
      }) => ({
        desc,
        qty,
        unit,
        total
      })),
      tax: draft.tax,
      shipping: Number(draft.shipping) || 0,
      other: Number(draft.other) || 0,
      comments: draft.comments,
      total: challanTotals.total
    };
    const {
      data,
      error
    } = await sb.from("challans").insert(payload).select();
    if (error) return setError(error.message);
    const updated = [data[0], ...challans];
    setChallans(updated);
    setDraft(newChallanDraft(`EV/${102 + updated.length}`));
  }
  function startNewChallan() {
    setDraft(newChallanDraft(`EV/${102 + challans.length}`));
  }
